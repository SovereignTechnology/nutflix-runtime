# CI for the public nutflix-runtime repo (GitHub Actions). Tests and CI never run on a developer
# machine; this is where they run. After nutflix-pear's ci.yml (the submodule's pinned commit).
#
# Supply-chain policy (as nutflix-pear's threat T12): actions pinned by commit SHA; `npm ci
# --ignore-scripts` (lockfile-only, exact pins, no lifecycle scripts); lockfile drift and
# non-registry resolutions fail; registry signatures and provenance verified; least-privilege
# token; no credentials persisted. nutflix-pear's packages come from the pinned submodule
# (vendor/nutflix-pear), checked out with the repository and built here.
#
# A weekly run on main (Monday) surfaces a new npm advisory without waiting for a push; it has a
# concurrency group of its own, so a push to main never cancels it. Every job has a timeout.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let the runner's environment inject loaders into anything we execute here.
  NODE_OPTIONS: ''

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: the submodule is at the commit this tree pins
        run: |
          git submodule status --recursive
          ! git submodule status --recursive | grep -q '^[-+U]'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: lockfile drift
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code --stat package-lock.json
      - name: every dependency resolves to registry.npmjs.org
        run: |
          node -e '
            const p = require("./package-lock.json").packages;
            const bad = Object.entries(p).filter(([k, v]) => k.startsWith("node_modules/") && !v.link && v.resolved && !/^https:\/\/registry\.npmjs\.org\//.test(v.resolved));
            if (bad.length) { console.error("non-registry resolutions:", bad.map(([k]) => k)); process.exit(1); }'
      - name: registry signatures and provenance
        run: npm audit signatures
      - name: advisories (high and above)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # The worker's tests import nutflix-pear's packages from their dist/, so the build comes first.
      - run: npm run build
      # With --coverage (v8): a summary in the log, the reports as the job's artifact.
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # Every target the app ships to (ADR 0001, amendment item 5). Each builds from source and runs
  # every test, including the built worker under the real Bare runtime with that platform's
  # prebuilt addons. One platform failing never hides the others.
  platforms:
    name: platform (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: win32-x64, os: windows-2025 }
    steps:
      # Windows runners would otherwise check text files out with CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: this runner is the target
        env:
          TARGET: ${{ matrix.target }}
        run: node -e "const t = process.platform + '-' + process.arch; console.log(t); if (t !== process.env.TARGET) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  # The renderer in a real browser: headless Chromium plays a VP9 video that the real worker fetches
  # over HyperDHT from nutflix-pear's own seeder code, on a loopback testnet, with a local relay.
  # Everything runs on this machine; nothing leaves loopback. ffmpeg makes the clip (VP9, because
  # the Chromium Playwright installs has no H.264). Its own job, so a browser problem never hides
  # the unit tests, and the unit tests never wait for a browser download.
  renderer-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: ffmpeg, for the clip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: playwright-core's Chromium
        run: npx --no-install playwright-core install --with-deps chromium
      # Chromium's sandbox stays on: Ubuntu 24.04 restricts the unprivileged user namespaces it
      # uses, so lift that on this throwaway runner, as nutflix-pear's web-site.yml does.
      - name: allow Chromium's user-namespace sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: e2e (packages/renderer/e2e)
        run: npm run test:e2e -w packages/renderer

  # The app itself, on every target (ADR 0001 amendment, item 5; shells/pear-v3). Each target builds
  # from source on its own OS, makes its package (a TEST build: nothing is signed, no secret is
  # used), launches the PACKAGED app, and waits for the one line the app prints once the window has
  # loaded the renderer and the worker has answered `status`. The app takes no test switch: this
  # runs the same binary a user would. Updates are off in this slice; `pear build`, `stage` and
  # `seed` are the next one. What each target proves is in shells/pear-v3/README.md.
  shell:
    name: shell (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # One shell for every step, Windows included (the steps below use bash's `$VAR`).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, platform: linux, arch: x64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { target: darwin-arm64, os: macos-15, platform: darwin, arch: arm64 }
          - { target: darwin-x64, os: macos-15-intel, platform: darwin, arch: x64 }
          - { target: win32-x64, os: windows-2025, platform: win32, arch: x64 }
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SHELL_OUT: shells/pear-v3/out
      SMOKE: shells/pear-v3/scripts/smoke.ts
    steps:
      # Windows runners would otherwise check text files out with CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: this runner is the target
        env:
          TARGET: ${{ matrix.target }}
        run: node -e "const t = process.platform + '-' + process.arch; console.log(t); if (t !== process.env.TARGET) process.exit(1)"
      - name: Electron's system libraries, Xvfb, and the AppImage tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb squashfs-tools fuse3 \
            libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The type-2 runtime goes in front of the squashfs. The release is a dated tag, and the maker
      # refuses a file whose sha256 is not its pin (packaging/maker-appimage.ts): nothing here is trusted.
      - name: the AppImage runtime (release 20251108; the maker checks its sha256)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          case "$ARCH" in x64) asset=runtime-x86_64 ;; arm64) asset=runtime-aarch64 ;; esac
          mkdir -p "$SHELL_OUT/appimage-runtime"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$SHELL_OUT/appimage-runtime/$asset" \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/$asset"
      - name: package (stage, Forge, fuses, layout)
        run: node shells/pear-v3/scripts/package.ts build --platform "$PLATFORM" --arch "$ARCH"
      # Information, not a gate: what a user on stock Ubuntu 24.04 gets today. The lift below hides it.
      - name: the AppImage on stock Ubuntu, restriction still on (information only)
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: |
          f="$SHELL_OUT/make/appimage/$ARCH/Nutflix.AppImage"
          echo "apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          code=0
          out=$(xvfb-run -a timeout 45 "$f" 2>&1) || code=$?
          echo "exit $code (124 = still running when stopped)"
          printf '%s\n' "$out" | grep -E 'NUTFLIX_SHELL|FATAL|SUID|sandbox' | cut -c1-200 | head -6 || true
      # Chromium's sandbox stays on: Ubuntu 24.04 restricts the unprivileged user namespaces it
      # uses, so lift that on this throwaway runner (the AppImage's chrome-sandbox is not setuid).
      - name: allow Chromium's user-namespace sandbox on this runner
        if: matrix.platform == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: the shipped Bare runtime is the version the worker needs
        run: |
          case "$PLATFORM" in
            linux) app="$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/resources/app" ;;
            darwin) app="$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/Resources/app" ;;
            win32) app="$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/resources/app" ;;
          esac
          node "$SMOKE" bare --app "$app" --platform "$PLATFORM" --arch "$ARCH"
      - name: launch the packaged AppImage; the window loads and the worker answers (Xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node "$SMOKE" appimage --file "$SHELL_OUT/make/appimage/$ARCH/Nutflix.AppImage"
      # Information for ADR 0001 amendment, item 3 (not a gate; that item is a later slice): what the
      # stock type-2 runtime does with no FUSE helper on PATH. It prints and exits; nothing starts.
      - name: the AppImage runtime without FUSE tools (information only)
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: |
          f="$SHELL_OUT/make/appimage/$ARCH/Nutflix.AppImage"
          echo "runtime: $("$f" --appimage-version 2>&1 | head -1)"
          empty="$RUNNER_TEMP/no-fuse-tools"
          mkdir -p "$empty"
          code=0
          out=$(timeout 30 /usr/bin/env PATH="$empty" "$f" --appimage-mount 2>&1 | head -3) || code=$?
          echo "without fusermount on PATH: exit $code, first lines: $out"
          echo "libfuse.so.2 present: $(ldconfig -p | grep -c 'libfuse\.so\.2' || true)"
      - name: launch the packaged .app; the window loads and the worker answers
        if: matrix.platform == 'darwin'
        run: node "$SMOKE" ready --exe "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/MacOS/Nutflix"
      - name: unpack the .msix, launch its app; the window loads and the worker answers
        if: matrix.platform == 'win32'
        run: node "$SMOKE" msix --file "$SHELL_OUT/make/msix/$ARCH/Nutflix.msix"
      # ADR 0001 amendment, item 2: with --no-sandbox the app warns before any window and does not
      # open one. (Nothing answers the box: the run proves the warning comes first.)
      - name: --no-sandbox shows the warning and opens no window (Linux, Xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node "$SMOKE" warning --exe "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix" --timeout 90
      - name: --no-sandbox shows the warning and opens no window (macOS)
        if: matrix.platform == 'darwin'
        run: node "$SMOKE" warning --exe "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/MacOS/Nutflix" --timeout 90
      - name: --no-sandbox shows the warning and opens no window (Windows)
        if: matrix.platform == 'win32'
        run: node "$SMOKE" warning --exe "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.exe" --timeout 90
      - name: zip the .app (symlinks and modes survive a zip made by ditto)
        if: matrix.platform == 'darwin'
        run: ditto -c -k --keepParent "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app" "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH.app.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-${{ matrix.target }}
          path: |
            shells/pear-v3/out/make/appimage/*/Nutflix.AppImage
            shells/pear-v3/out/make/msix/*/Nutflix.msix
            shells/pear-v3/out/Nutflix-*.app.zip
          if-no-files-found: error
          retention-days: 3
