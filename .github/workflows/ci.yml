# CI for the public nutflix-runtime repo (GitHub Actions). Tests and CI never run on a developer
# machine; this is where they run. After nutflix-pear's ci.yml (the submodule's pinned commit).
#
# Supply-chain policy (as nutflix-pear's threat T12): actions pinned by commit SHA; `npm ci
# --ignore-scripts` (lockfile-only, exact pins, no lifecycle scripts); lockfile drift and
# non-registry resolutions fail; registry signatures and provenance verified; least-privilege
# token; no credentials persisted. nutflix-pear's packages come from the pinned submodule
# (vendor/nutflix-pear), checked out with the repository and built here.
#
# A weekly run on main (Monday) surfaces a new npm advisory without waiting for a push; it has a
# concurrency group of its own, so a push to main never cancels it. Every job has a timeout.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule-' || '' }}${{ github.ref }}
  cancel-in-progress: true

env:
  # Never let the runner's environment inject loaders into anything we execute here.
  NODE_OPTIONS: ''

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: the submodule is at the commit this tree pins
        run: |
          git submodule status --recursive
          ! git submodule status --recursive | grep -q '^[-+U]'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: lockfile drift
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code --stat package-lock.json
      - name: every dependency resolves to registry.npmjs.org
        run: |
          node -e '
            const p = require("./package-lock.json").packages;
            const bad = Object.entries(p).filter(([k, v]) => k.startsWith("node_modules/") && !v.link && v.resolved && !/^https:\/\/registry\.npmjs\.org\//.test(v.resolved));
            if (bad.length) { console.error("non-registry resolutions:", bad.map(([k]) => k)); process.exit(1); }'
      # The registry's attestations endpoint sometimes answers with no JSON (FETCH_ERROR, four times
      # on 2026-11-24). Only that is tried again, three attempts at most; a missing or invalid
      # signature or attestation fails at once. The rule's own test runs first, on fake outputs.
      - name: the retry rule of the next step, on fake npm outputs
        run: bash .github/scripts/npm-audit-signatures.test.sh
      - name: registry signatures and provenance
        run: bash .github/scripts/npm-audit-signatures.sh
      - name: advisories (high and above)
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      # The worker's tests import nutflix-pear's packages from their dist/, so the build comes first.
      - run: npm run build
      # With --coverage (v8): a summary in the log, the reports as the job's artifact.
      - run: npm test -- --coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  # Every target the app ships to (ADR 0001, amendment item 5). Each builds from source and runs
  # every test, including the built worker under the real Bare runtime with that platform's
  # prebuilt addons. One platform failing never hides the others.
  platforms:
    name: platform (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: win32-x64, os: windows-2025 }
    steps:
      # Windows runners would otherwise check text files out with CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: this runner is the target
        env:
          TARGET: ${{ matrix.target }}
        run: node -e "const t = process.platform + '-' + process.arch; console.log(t); if (t !== process.env.TARGET) process.exit(1)"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test

  # The renderer in a real browser: headless Chromium plays a VP9 video that the real worker fetches
  # over HyperDHT from nutflix-pear's own seeder code, on a loopback testnet, with a local relay.
  # Everything runs on this machine; nothing leaves loopback. ffmpeg makes the clip (VP9, because
  # the Chromium Playwright installs has no H.264). Its own job, so a browser problem never hides
  # the unit tests, and the unit tests never wait for a browser download.
  renderer-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: ffmpeg, for the clip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: playwright-core's Chromium
        run: npx --no-install playwright-core install --with-deps chromium
      # Chromium's sandbox stays on: Ubuntu 24.04 restricts the unprivileged user namespaces it
      # uses, so lift that on this throwaway runner, as nutflix-pear's web-site.yml does.
      - name: allow Chromium's user-namespace sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: e2e (packages/renderer/e2e)
        run: npm run test:e2e -w packages/renderer

  # The app itself, on every target (ADR 0001 amendment, item 5; shells/pear-v3). Each target builds
  # from source on its own OS, makes its package (a TEST build: nothing is signed, no secret is
  # used), launches the PACKAGED app, and waits for the one line the app prints once the window has
  # loaded the renderer and the worker has answered `status`. The app takes no test switch: this
  # runs the same binary a user would, and it must say it runs no updater. `install`, below, takes the
  # packages this job uploads through `pear build`, `stage`, `seed` and `install`. What each target
  # proves is in shells/pear-v3/README.md.
  shell:
    name: shell (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # One shell for every step, Windows included (the steps below use bash's `$VAR`).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, platform: linux, arch: x64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { target: darwin-arm64, os: macos-15, platform: darwin, arch: arm64 }
          - { target: darwin-x64, os: macos-15-intel, platform: darwin, arch: x64 }
          - { target: win32-x64, os: windows-2025, platform: win32, arch: x64 }
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SHELL_OUT: shells/pear-v3/out
      SMOKE: shells/pear-v3/scripts/smoke.ts
    steps:
      # Windows runners would otherwise check text files out with CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: this runner is the target
        env:
          TARGET: ${{ matrix.target }}
        run: node -e "const t = process.platform + '-' + process.arch; console.log(t); if (t !== process.env.TARGET) process.exit(1)"
      - name: Electron's system libraries, Xvfb, and the AppImage tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb squashfs-tools fuse3 \
            libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4
      - run: npm ci --ignore-scripts
      - run: npm run build
      # The type-2 runtime goes in front of the squashfs. The release is a fixed tag, and the maker
      # refuses a file whose sha256 is not its pin (packaging/maker-appimage.ts): nothing here is trusted.
      - name: the patched AppImage runtime (this repo's release; the maker checks its sha256)
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          case "$ARCH" in x64) asset=runtime-x86_64 ;; arm64) asset=runtime-aarch64 ;; esac
          mkdir -p "$SHELL_OUT/appimage-runtime"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$SHELL_OUT/appimage-runtime/$asset" \
            "https://github.com/SovereignTechnology/nutflix-runtime/releases/download/appimage-runtime-20251108-nutflix.1/$asset"
      - name: package (stage, Forge, fuses, layout)
        run: node shells/pear-v3/scripts/package.ts build --platform "$PLATFORM" --arch "$ARCH"
      # The production root, read from the packaged bytes. This is the only check a build with a
      # real upgrade link ever gets on a runner: it is never launched here.
      - name: the packaged root is the production root (read, not run)
        run: |
          case "$PLATFORM" in
            darwin) app="$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/Resources/app" ;;
            *) app="$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/resources/app" ;;
          esac
          node shells/pear-v3/scripts/release/cli.ts verify-root --app "$app"
      # What the steps below launch. With no link in the source, the package above, as a user would
      # run it. With a link, a second build of this source with a throwaway root and no link
      # (docs/release.md, "The day the link is set"): the production build is never started here.
      - name: what this job launches
        run: |
          node shells/pear-v3/scripts/release/launch-subject.ts --platform "$PLATFORM" --arch "$ARCH" --out "$SHELL_OUT" > "$RUNNER_TEMP/launch-subject"
          cat "$RUNNER_TEMP/launch-subject"
          cat "$RUNNER_TEMP/launch-subject" >> "$GITHUB_ENV"
      # A build with an upgrade link starts an updater on the public DHT at launch, so it must never
      # be launched here. This reads the packaged bytes of what is about to run, before the first
      # launch, whichever build that is.
      - name: this build starts no updater
        run: |
          case "$PLATFORM" in
            darwin) app="$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/Resources/app" ;;
            *) app="$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/resources/app" ;;
          esac
          node shells/pear-v3/scripts/pear-ci/no-updater.ts "$app"
      # No runner talks to a public Nostr relay or STUN server: the app's renderer connects to its
      # default relays as soon as it loads, so those names point at loopback from here on.
      - name: the app's public relay names point at loopback on this runner
        run: node shells/pear-v3/scripts/pear-ci/sinkhole.ts
      # Stock Ubuntu 24.04, before the restriction is lifted below: what a user there gets. The
      # AppImage must reach the warning, and after "Run anyway" it must run and say the sandbox is off.
      - name: stock Ubuntu, no usable sandbox, the AppImage reaches the warning (Xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node "$SMOKE" stock-warning --file "$LAUNCH_OUT/make/appimage/$ARCH/Nutflix.AppImage" --timeout 90
      - name: stock Ubuntu, after Run anyway, the AppImage runs with the sandbox off (Xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node "$SMOKE" stock-consented --file "$LAUNCH_OUT/make/appimage/$ARCH/Nutflix.AppImage" --timeout 120
      # Chromium's sandbox stays on: Ubuntu 24.04 restricts the unprivileged user namespaces it
      # uses, so lift that on this throwaway runner (the AppImage's chrome-sandbox is not setuid).
      - name: allow Chromium's user-namespace sandbox on this runner
        if: matrix.platform == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The launcher asks this where the kernel has a limit but the sandbox still starts. A hang
      # here would be a hang at every start on those machines.
      - name: the launcher's sandbox question answers at once and opens nothing (Linux, Xvfb)
        if: matrix.platform == 'linux'
        run: |
          out=$(xvfb-run -a timeout 60 "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix" --sandbox-preflight 2>&1) || {
            echo "the preflight exited $?"; printf '%s\n' "$out" | tail -20; exit 1; }
          if printf '%s\n' "$out" | grep -q NUTFLIX_SHELL; then echo "the preflight ran the app"; exit 1; fi
          echo "preflight: exit 0, nothing started"
      - name: the shipped Bare runtime is the version the worker needs
        run: |
          case "$PLATFORM" in
            linux) app="$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/resources/app" ;;
            darwin) app="$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/Resources/app" ;;
            win32) app="$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/resources/app" ;;
          esac
          node "$SMOKE" bare --app "$app" --platform "$PLATFORM" --arch "$ARCH"
      - name: launch the packaged AppImage; the window loads and the worker answers (Xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node "$SMOKE" appimage --file "$LAUNCH_OUT/make/appimage/$ARCH/Nutflix.AppImage"
      # ADR 0001 amendment, item 3: with no FUSE tools the real app still starts, from a private
      # extraction, says how to start faster once, and reuses the extraction on the next start.
      - name: no FUSE tools, the AppImage runs from a private extraction, with the notice (Xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node "$SMOKE" no-fuse --file "$LAUNCH_OUT/make/appimage/$ARCH/Nutflix.AppImage" --timeout 180
      - name: launch the packaged .app; the window loads and the worker answers
        if: matrix.platform == 'darwin'
        run: node "$SMOKE" ready --exe "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/MacOS/Nutflix"
      - name: unpack the .msix, launch its app; the window loads and the worker answers
        if: matrix.platform == 'win32'
        run: node "$SMOKE" msix --file "$LAUNCH_OUT/make/msix/$ARCH/Nutflix.msix"
      # ADR 0001 amendment, item 2: with --no-sandbox the app warns before any window and does not
      # open one. (Nothing answers the box: the run proves the warning comes first.)
      - name: --no-sandbox shows the warning and opens no window (Linux, Xvfb)
        if: matrix.platform == 'linux'
        run: xvfb-run -a node "$SMOKE" warning --exe "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix" --timeout 90
      - name: --no-sandbox shows the warning and opens no window (macOS)
        if: matrix.platform == 'darwin'
        run: node "$SMOKE" warning --exe "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app/Contents/MacOS/Nutflix" --timeout 90
      - name: --no-sandbox shows the warning and opens no window (Windows)
        if: matrix.platform == 'win32'
        run: node "$SMOKE" warning --exe "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.exe" --timeout 90
      # With the bundle's digest, taken here: `assemble` unpacks the zip on another OS and must get
      # this exact tree back (every file, executable bit and symlink the signature seals).
      - name: zip the .app (symlinks and modes survive a zip made by ditto)
        if: matrix.platform == 'darwin'
        run: |
          ditto -c -k --keepParent "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app" "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH.app.zip"
          node shells/pear-v3/scripts/release/cli.ts bundle-digest --app "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app" --write "$LAUNCH_OUT/Nutflix-$PLATFORM-$ARCH.app.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-${{ matrix.target }}
          path: |
            ${{ env.LAUNCH_OUT }}/make/appimage/*/Nutflix.AppImage
            ${{ env.LAUNCH_OUT }}/make/msix/*/Nutflix.msix
            ${{ env.LAUNCH_OUT }}/Nutflix-*.app.zip
            ${{ env.LAUNCH_OUT }}/Nutflix-*.app.digest
          if-no-files-found: error
          retention-days: 3
      # The production build, which nothing here launched: only once the source has a real link,
      # and only from a push to main. A pull request's build must never look like a release, and
      # the release tool takes nothing else (`release download`, docs/release.md).
      - name: zip the production .app
        if: env.LAUNCH_OUT != env.SHELL_OUT && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.platform == 'darwin'
        run: |
          ditto -c -k --keepParent "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app" "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH.app.zip"
          node shells/pear-v3/scripts/release/cli.ts bundle-digest --app "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH/Nutflix.app" --write "$SHELL_OUT/Nutflix-$PLATFORM-$ARCH.app.digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.LAUNCH_OUT != env.SHELL_OUT && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.SHELL_OUT }}/make/appimage/*/Nutflix.AppImage
            ${{ env.SHELL_OUT }}/make/msix/*/Nutflix.msix
            ${{ env.SHELL_OUT }}/Nutflix-*.app.zip
            ${{ env.SHELL_OUT }}/Nutflix-*.app.digest
          if-no-files-found: error
          retention-days: 3

  # ADR 0001 amendment, item 5: each target must pass a real `pear install` and launch. Each leg
  # downloads the five packages of the `shell` job, merges them with `pear build`, stages the
  # deployment onto a THROWAWAY link, seeds it and installs it again, all on this one runner, then
  # launches the INSTALLED app and reads its ready line.
  #
  # HARD CONSTRAINT: no runner is a peer of the public network (GitHub disabled Actions on another
  # repository of this account for hosting one). Everything here runs on a private HyperDHT on
  # 127.0.0.1 in this job, every Pear process is told so, and a firewall rule drops and COUNTS any
  # packet to HyperDHT's public bootstrap, so that the log says how many there were (zero). The Pear
  # CLI is an HTTPS download of its GitHub release, pinned by sha256, not a DHT fetch. The app's
  # public relay names are blackholed and the tripwire counts their real addresses too. No real or
  # production link exists; no secret is used. The Windows leg signs its copies of the TEST .msix
  # with a certificate made in the job and trusted on this runner only.
  #
  # The same job proves the update gate: two more real builds, made here with a THROWAWAY key, a
  # relay on 127.0.0.1 and a link on the private DHT baked in (`package.ts test-build`, which refuses
  # the production key). The installed app must hold the second build with no notice, a wrong-hash
  # notice and a wrong-signer notice, and apply it with a matching one.
  # shells/pear-v3/scripts/pear-ci/run.ts says what each step does; the README says what it proves.
  install:
    name: install (${{ matrix.target }})
    needs: shell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04, platform: linux, arch: x64 }
          - { target: linux-arm64, os: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { target: darwin-arm64, os: macos-15, platform: darwin, arch: arm64 }
          - { target: darwin-x64, os: macos-15-intel, platform: darwin, arch: x64 }
          - { target: win32-x64, os: windows-2025, platform: win32, arch: x64 }
    steps:
      # Windows runners would otherwise check text files out with CRLF.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: this runner is the target
        env:
          TARGET: ${{ matrix.target }}
        run: node -e "const t = process.platform + '-' + process.arch; console.log(t); if (t !== process.env.TARGET) process.exit(1)"
      - name: Electron's system libraries, Xvfb, FUSE, iptables
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb fuse3 unzip iptables libatomic1 \
            squashfs-tools libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4
      - run: npm ci --ignore-scripts
      # The update gate's test builds are packaged in this job, once the private link exists.
      - run: npm run build
      - name: the patched AppImage runtime (this repo's release; the maker checks its sha256)
        if: matrix.platform == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          case "$ARCH" in x64) asset=runtime-x86_64 ;; arm64) asset=runtime-aarch64 ;; esac
          mkdir -p shells/pear-v3/out/appimage-runtime
          curl --proto '=https' --tlsv1.2 -fsSL -o "shells/pear-v3/out/appimage-runtime/$asset" \
            "https://github.com/SovereignTechnology/nutflix-runtime/releases/download/appimage-runtime-20251108-nutflix.1/$asset"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shell-*
          path: ${{ runner.temp }}/artifacts
      # Chromium's sandbox stays on: lift Ubuntu 24.04's restriction on this throwaway runner, as the
      # `shell` job does (the AppImage's chrome-sandbox is not setuid).
      - name: allow Chromium's user-namespace sandbox on this runner
        if: matrix.platform == 'linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: pear build, stage, seed and install on a private DHT; launch the installed app (Xvfb)
        if: matrix.platform == 'linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          xvfb-run -a node shells/pear-v3/scripts/pear-install.ts --target "$TARGET" \
            --artifacts "$RUNNER_TEMP/artifacts" --work "$RUNNER_TEMP/pear-install"
      - name: pear build, stage, seed and install on a private DHT; launch the installed app
        if: matrix.platform != 'linux'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node shells/pear-v3/scripts/pear-install.ts --target "$TARGET" \
            --artifacts "$RUNNER_TEMP/artifacts" --work "$RUNNER_TEMP/pear-install"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: install-${{ matrix.target }}-logs
          path: |
            ${{ runner.temp }}/pear-install/logs
            ${{ runner.temp }}/pear-install/result.json
          if-no-files-found: ignore
          retention-days: 3

  # The release pipeline, end to end, with nothing real in it (shells/pear-v3/scripts/release/,
  # docs/release.md). On one runner: the five packages of `shell` go through check, assemble,
  # `pear build`, digest and a notice draft; then two more builds go through build, stage, provision,
  # `pear multisig` (three throwaway signers, quorum two) and `pear install`, and the installed app
  # holds and applies the update through the real gate. Last, the path for the day the source gets a
  # real link: the build CI would launch instead must pass the unchanged no-updater guard.
  #
  # HARD CONSTRAINT, as in `install`: no runner is a peer of the public network. Every Pear process
  # is on a private DHT on 127.0.0.1, the app's public relay names point at loopback, and the
  # tripwire must count zero packets to the public bootstrap and relays. No key, link or notice
  # here is real; none outlives the job, and nothing is published.
  release-proof:
    name: release proof (linux-x64)
    needs: shell
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # `actions: read` so that the proof can fetch this run's artifacts by id and hold them to
    # GitHub's digests, the way the release tool does. It reads; it writes nothing.
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Electron's system libraries, Xvfb, FUSE, iptables, and the package readers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb fuse3 unzip iptables libatomic1 \
            squashfs-tools libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxss1 libxtst6 libnotify4
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: the patched AppImage runtime (this repo's release; the maker checks its sha256)
        run: |
          set -euo pipefail
          mkdir -p shells/pear-v3/out/appimage-runtime
          curl --proto '=https' --tlsv1.2 -fsSL -o shells/pear-v3/out/appimage-runtime/runtime-x86_64 \
            "https://github.com/SovereignTechnology/nutflix-runtime/releases/download/appimage-runtime-20251108-nutflix.1/runtime-x86_64"
      - name: allow Chromium's user-namespace sandbox on this runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The job's read-only token, in a file only this user can read: it is in no later process's
      # environment. prove.ts reads it, deletes the file, and hands the token to `gh` alone.
      - name: the API token, for gh alone
        env:
          TOKEN: ${{ github.token }}
        run: |
          umask 077
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/release-proof-gh-token"
      - name: the release, end to end, on a private DHT with throwaway keys (Xvfb)
        run: |
          xvfb-run -a node shells/pear-v3/scripts/release/prove.ts --target linux-x64 \
            --token-file "$RUNNER_TEMP/release-proof-gh-token" \
            --work "$RUNNER_TEMP/release-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-proof-logs
          path: |
            ${{ runner.temp }}/release-proof/logs
            ${{ runner.temp }}/release-proof/result.json
          if-no-files-found: ignore
          retention-days: 3

  # The runbook's signing step, on the two OSes that sign, with certificates that are NOT real: an
  # ad-hoc signature on macOS and one made for this job on Windows. The tool must accept the signed
  # package and refuse anything else changed. Apple's and a CA's tools are not proven here.
  signing-proof:
    name: signing proof (${{ matrix.target }})
    needs: shell
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: win32-x64, os: windows-2025 }
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shell-${{ matrix.target }}
          path: ${{ runner.temp }}/artifact
      - name: a signed package is accepted, and nothing else changed with it
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node shells/pear-v3/scripts/release/prove-signing.ts --target "$TARGET" \
            --artifact "$RUNNER_TEMP/artifact" --work "$RUNNER_TEMP/signing-proof"
